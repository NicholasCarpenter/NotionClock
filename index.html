<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body { margin: 0; height: 100%; background: #191919; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
  .card { box-sizing: border-box; height: 100%; display: flex; align-items: center; justify-content: center; background: #191919; border: 1px solid #2f2f2f; border-radius: 14px; padding: 10px; }
  svg { width: 100%; max-width: 280px; height: auto; display: block; }
  .tick { stroke: #e8e8e8; stroke-width: 2.2; stroke-linecap: round; }
  .hand { stroke: #ffffff; stroke-linecap: round; }
  .sec  { stroke: #5ec8ff; stroke-width: 1.4; stroke-linecap: round; }
  .digital { fill: #ffffff; font-size: 17px; font-weight: 600; text-anchor: middle; }
  .day { fill: #bdbdbd; font-size: 12px; text-anchor: middle; letter-spacing: .5px; }
</style>
</head>
<body>
<div class="card">
<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <g id="ticks"></g>
  <text id="digital" class="digital" x="120" y="150">--:--</text>
  <text id="day" class="day" x="120" y="168">----</text>
  <line id="hour" class="hand" x1="120" y1="120" x2="120" y2="72" stroke-width="3.2"/>
  <line id="min"  class="hand" x1="120" y1="120" x2="120" y2="44" stroke-width="2.2"/>
  <line id="sec"  class="sec"  x1="120" y1="132" x2="120" y2="38"/>
  <circle cx="120" cy="120" r="3.5" fill="#ffffff"/>
</svg>
</div>
<script>
  var ticks = document.getElementById('ticks');
  for (var i = 0; i < 12; i++) {
    var a = i * 30 * Math.PI / 180;
    var big = (i % 3 === 0);
    var r1 = big ? 98 : 102, r2 = 112;
    var l = document.createElementNS('http://www.w3.org/2000/svg', 'line');
    l.setAttribute('class', 'tick');
    l.setAttribute('x1', 120 + r1 * Math.sin(a)); l.setAttribute('y1', 120 - r1 * Math.cos(a));
    l.setAttribute('x2', 120 + r2 * Math.sin(a)); l.setAttribute('y2', 120 - r2 * Math.cos(a));
    ticks.appendChild(l);
  }
  var days = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  function tick() {
    var d = new Date();
    var s = d.getSeconds(), m = d.getMinutes(), h = d.getHours();
    document.getElementById('sec').setAttribute('transform', 'rotate(' + (s * 6) + ' 120 120)');
    document.getElementById('min').setAttribute('transform', 'rotate(' + ((m + s / 60) * 6) + ' 120 120)');
    document.getElementById('hour').setAttribute('transform', 'rotate(' + (((h % 12) + m / 60) * 30) + ' 120 120)');
    document.getElementById('digital').textContent = (h < 10 ? '0' : '') + h + ':' + (m < 10 ? '0' : '') + m;
    document.getElementById('day').textContent = days[d.getDay()];
  }
  tick(); setInterval(tick, 1000);
</script>
</body>
</html>
